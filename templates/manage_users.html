{% extends "base.html" %}

{% block content %}

    <div class="container">
        <div class="header">
            <h1 class="page-title">Gestion des utilisateurs </h1>
            <a></a>
        </div>
    </div>

    <div style="text-align: center">
        <a href="{{ url_for('create_user') }}" class="button-secondary"> Ajouter un utilisateur</a>
    </div>

    <table class="users-table">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Courriel</th>
                <th>Actions</th>
            </tr>
        </thead>
        {% for user in users %}
        <tr style="text-align: center">
            <td>{{ user.id }}</td>
            <td>{{ user.nom }}</td>
            <td>{{ user.prenom }}</td>
            <td>{{ user.courriel }}</td>
            <td>
                <span>|</span>
                <a href="{{ url_for('modify_user', user_id=user.id) }}"> Modifier</a>
                <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST"
                      style="display:inline;" >
                    <button type="submit" style="border:none; background:none; color:red; cursor:pointer;">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

{% endblock %}
