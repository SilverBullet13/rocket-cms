{% extends 'base.html' %}

{% block content %}

    <div class="container">
        <div class="header">
            <h1 class="page-title">MODIFIER L'ARTICLE </h1>
        </div>
    </div>

    <form action="{{ url_for('edit_article', identifiant=article.identifiant) }}" method="POST">
        <label for="titre">Titre</label>
        <input type="text" id="titre" name="titre" value="{{ article.titre }}" required>

        <label for="contenu">Contenu</label>
        <textarea id="contenu" name="contenu" rows="8" required>{{ article.contenu }}</textarea>

        <div class="button-group">
            <button type="submit">Soumettre</button>
        </div>
    </form>

    <div class="button-group">
        <a href="{{ url_for('dashboard') }}" class="edit-btn">Retour</a>
    </div>

{% endblock %}
